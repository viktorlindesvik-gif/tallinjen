cv.onpointermove=e=>{if(drawing){if(cur){const v=V(lx(e));cur.pts.push([v,(ly(e)-AY())/view.p]);cur.a=Math.min(cur.a,v);cur.b=Math.max(cur.b,v);draw()}return}const o=ptr.get(e.pointerId);if(!o)return;const x=lx(e),y=ly(e);
if(ptr.size==1){view.c-=(x-o.x)/view.p;moved+=Math.abs(x-o.x)+Math.abs(y-o.y)}
o.x=x;o.y=y;
if(ptr.size==2&&pinch){const[a,b]=[...ptr.values()],d=Math.hypot(a.x-b.x,a.y-b.y),m=(a.x+b.x)/2;zoomAt(d/pinch.d,m);view.c-=(m-pinch.m)/view.p;pinch={d,m};moved=99}
clampV();draw()};
cv.onpointerup=cv.onpointercancel=e=>{if(drawing){cur=null;return}const o=ptr.get(e.pointerId);ptr.delete(e.pointerId);cv.style.cursor='grab';pinch=null;
if(o&&ptr.size==0&&moved<6&&e.type=='pointerup'){const h=[...hits].reverse().find(h=>o.x>=h.x&&o.x<=h.x+h.w&&o.y>=h.y&&o.y<=h.y+h.h);
if(h)select(h.o);else{sel=null;$('#card').hidden=true;go(V(o.x),view.p)}}};
cv.onwheel=e=>{e.preventDefault();if(drawing)return;anim=null;zoomAt(Math.exp(-e.deltaY*.0015),lx(e));draw()};
cv.ondblclick=e=>{if(drawing)return;anim=null;zoomAt(2.5,lx(e));draw()};
let md=0;const mset=e=>{if(drawing)return;const x=e.clientX-mm.getBoundingClientRect().left;anim=null;view.c=cl((x-16)/(MW-32)*100,0,100);draw()};
mm.onpointerdown=e=>{md=1;mm.setPointerCapture(e.pointerId);mset(e)};mm.onpointermove=e=>{if(md)mset(e)};mm.onpointerup=()=>md=0;
$('#zi').onclick=()=>go(view.c,view.p*4);$('#zo').onclick=()=>go(view.c,view.p/4);$('#all').onclick=()=>{found=null;go(50,minP())};
const ALIAS={pi:'π',phi:'φ',tau:'τ',gamma:'γ',sqrt2:'√2'};
function parseQ(s){s=s.trim().toLowerCase().replace(/\s/g,'').replace(/,/g,'.');if(!s)return null;s=ALIAS[s]||s;
const k=C.find(o=>o.n.toLowerCase()==s);if(k)return{v:k.v,p:3000,o:k};
let m=s.match(/^(\d+\.?\d*)\/(\d+\.?\d*)$/);if(m&&+m[2]>0)return{v:+m[1]/+m[2],p:3000};
m=s.match(/^(\d*)\.?(\d*)$/);if(m&&/\d/.test(s))return{v:parseFloat(s),p:Math.min(MAXP,120*Math.pow(10,Math.min(3,m[2].length)))};
return null}
function search(live){if(ex){if(!live)flash('Sökrutan är avstängd under övningen',2800);return}const q=parseQ($('#gt').value);
if(!q||!(q.v>=0&&q.v<=100)){if(!live)flash(q?'Talet ligger utanför 0–100':'Skriv ett tal mellan 0 och 100, t.ex. 42 eller 3,14159',2800);return}
if(drawing)$('#dr').click();
found=q.v;if(q.o)select(q.o);go(q.v,q.p);if(!live)$('#gt').blur()}
let st;$('#gt').oninput=()=>{clearTimeout(st);st=setTimeout(()=>search(true),350)};
$('#gt').onkeydown=e=>{if(e.key=='Enter'){clearTimeout(st);search(false)}};
$('#go').onclick=()=>search(false);
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT'||drawing)return;if(e.key=='+'||e.key=='=')$('#zi').click();if(e.key=='-')$('#zo').click();
if(e.key=='ArrowLeft'){view.c-=60/view.p;clampV();draw()}if(e.key=='ArrowRight'){view.c+=60/view.p;clampV();draw()}});
const hint=$('#hint'),H0=hint.textContent;let ht;
function flash(m,ms){clearTimeout(ht);hint.textContent=m;hint.style.opacity=1;if(ms)ht=setTimeout(()=>hint.style.opacity=0,ms)}
function hideHint(){clearTimeout(ht);hint.style.opacity=0}
['pointerdown','wheel','keydown'].forEach(t=>addEventListener(t,hideHint,{passive:true,capture:true}));
const PE=$('#dr').innerHTML,PL='<svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></svg><span>Fortsätt</span>';
function setPen(c){pen=c;document.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',b.dataset.c==c))}
document.querySelectorAll('.sw').forEach(b=>b.onclick=()=>setPen(b.dataset.c));setPen(pen);
$('#dr').onclick=()=>{drawing=!drawing;if(drawing)closeLp();anim=null;cur=null;ptr.clear();pinch=null;$('#tools').hidden=!drawing;$('#dr').innerHTML=drawing?PL:PE;$('#dr').classList.toggle('on',drawing);document.body.classList.toggle('drawing',drawing);
cv.style.cursor=drawing?'crosshair':'grab';if(drawing)select(null);draw()};
let shown=true;
function applyVis(){const h=ex&&!ex.done;$('#rv').hidden=!shown||!!h;$('#tg').hidden=!!h;$('#sr').hidden=!!ex}
$('#tg').onclick=()=>{shown=!shown;$('#tg').textContent=shown?'Dölj talet':'Tryck för att visa talet';applyVis()};
const LN=['Tiotal','Heltal','Tiondelar','Hundradelar','Tusendelar'],NM=['heltal','tiondelar','hundradelar','tusendelar'];
const TOUR=[{c:50,p:0,t:'Här ser du hela tallinjen, från 0 till 100. Strecken är tiotal: 0, 10, 20 …'},{c:37,p:60,t:'Zooma in! Nu syns heltalen, ett streck för varje. Titta på området runt 37.'},{c:37.5,p:600,t:'Zooma mer. Mellan två heltal ryms 10 tiondelar: 37,2 – 37,3 – 37,4 …'},{c:37.45,p:6000,t:'Ännu mer. Mellan två tiondelar ryms 10 hundradelar: 37,43 – 37,44 – 37,45 …'},{c:37.462,p:60000,t:'Längst in ser du tusendelar. Varje steg in gör skalan 10 gånger finare.'}];
const fb=(m,ok)=>{const f=$('#fb');if(f){f.textContent=m;f.className='fb'+(ok?' ok':'')}};
function endEx(){if(!ex)return;ex=null;mark=null;applyVis();draw()}
function closeLp(){endEx();$('#lp').hidden=true}
function openLp(){if(drawing)$('#dr').click();select(null);found=null;ti=0;$('#lp').hidden=false;lpTab('tour')}
function lpTab(t){endEx();document.querySelectorAll('#lt .tab').forEach(b=>b.classList.toggle('on',b.dataset.t==t));if(t=='tour')tour();else exMenu()}
function tour(){const s=TOUR[ti];$('#pg').innerHTML=`<p class='st'>Steg ${ti+1} av ${TOUR.length}</p><p class='tt'>${s.t}</p><div class='r'><button id='tb'>Bakåt</button><button id='tn' class='pri'>${ti<TOUR.length-1?'Nästa':'Prova själv'}</button></div>`;
$('#tb').disabled=!ti;$('#tb').onclick=()=>{ti--;tour()};$('#tn').onclick=()=>{if(ti<TOUR.length-1){ti++;tour()}else{ti=0;lpTab('ex')}};go(s.c,s.p||minP())}
function exMenu(){const pg=$('#pg');
pg.innerHTML=`<p class='st'>Välj övning</p><p>Vad vill du träna?</p><div class='r' id='sk'><button data-k='find'>Hitta talet</button><button data-k='read'>Läs av talet</button><button data-k='round'>Avrunda</button><button data-k='between'>Mellan två tal</button><button data-k='mid'>Mitt emellan</button><button data-k='cmp'>Vilket är störst?</button></div><p>Hur noggrant?</p><div class='r' id='sl'>${NM.map((n,i)=>`<button data-l='${i}'>${n[0].toUpperCase()+n.slice(1)}</button>`).join('')}</div><div class='r'><button id='sx'><svg viewBox='0 0 24 24'><path d='M7 5l12 7-12 7z'/></svg>Starta</button></div>`;
const upd=()=>{pg.querySelectorAll('#sk button').forEach(b=>b.classList.toggle('on',b.dataset.k==exKind));pg.querySelectorAll('#sl button').forEach(b=>b.classList.toggle('on',b.dataset.l==exLv))};
pg.querySelectorAll('#sk button').forEach(b=>b.onclick=()=>{exKind=b.dataset.k;upd()});
pg.querySelectorAll('#sl button').forEach(b=>b.onclick=()=>{exLv=+b.dataset.l;upd()});upd();$('#sx').onclick=newEx}
function newEx(){if(exKind!='find'&&exKind!='read')return newEx2();found=null;const s=Math.pow(10,exLv);let r;do{r=exLv?Math.floor(s+Math.random()*99*s):1+Math.floor(Math.random()*99)}while(exLv&&r%10==0);
ex={kind:exKind,l:exLv,s,t:r/s,done:false};mark=exKind=='read'?ex.t:null;applyVis();
anim=null;view.c=50;view.p=minP();clampV();const k=exKind=='find';
$('#pg').innerHTML=`<p class='st'>${k?'Hitta talet':'Läs av talet'} · ${NM[exLv]}</p>`+(k?`<p class='tt'>Hitta ${fm(ex.t,exLv)}</p><p>Zooma och flytta så att den streckade linjen i mitten pekar exakt på talet.</p>`:`<p class='tt'>Vilket tal pekar ringen på?</p><p>Zooma in tills ringen ligger på ett streck och läs av talet.</p><div class='r'><input id='ans' inputmode='decimal' placeholder='Ditt svar'><button id='ab' class='pri'>Svara</button></div>`)+`<p class='fb' id='fb'></p><div class='r'><button id='hb'>Ledtråd</button><button id='nx'>Nytt tal</button><button id='qx'>Avsluta</button></div>`;
$('#nx').onclick=newEx;$('#qx').onclick=()=>lpTab('ex');$('#hb').onclick=hintEx;
if(!k){$('#ab').onclick=check;$('#ans').onkeydown=e=>{if(e.key=='Enter')check()}}draw()}
function win(){ex.done=true;applyVis();fb(`Rätt! ${ex.kind=='find'?'Du hittade':'Ringen pekar på'} ${fm(ex.t,ex.l)}.`,1);const n=$('#nx');if(n)n.classList.add('pri')}
function hintEx(){if(ex.done)return;if(ex.kind=='find')fb(view.p<30*ex.s?`Zooma in tills du ser ${NM[ex.l]} som streck.`:view.c<ex.t?'Talet ligger längre till höger på linjen.':'Talet ligger längre till vänster på linjen.');else fb('Ta ett steg i taget: mellan vilka tiotal ligger ringen? Zooma in och titta sedan på heltalen, tiondelarna …')}
function check(){if(ex.done)return;const v=parseFloat($('#ans').value.replace(',','.'));if(!isFinite(v))return fb('Skriv ett tal, till exempel 12,5.');
if(Math.abs(v-ex.t)<1e-9)win();else fb(Math.abs(v-ex.t)<=3/ex.s?'Nära! Zooma in mer och se vilket streck ringen ligger på.':'Inte riktigt. Zooma in och läs av streck för streck.')}
const KN={round:'Avrunda',between:'Mellan två tal',mid:'Mitt emellan',cmp:'Vilket är störst?'},SN=['heltal','tiondel','hundradel','tusendel'];
function newEx2(){found=null;const d=exLv,s=Math.pow(10,d),k=exKind,R=(a,b)=>a+Math.floor(Math.random()*(b-a));
ex={kind:k,l:d,s,done:false};mark=null;let h='';
const inp=`<div class='r'><input id='ans' inputmode='decimal' placeholder='Ditt svar'><button id='ab' class='pri'>Svara</button></div>`;
if(k=='round'){let r;do{r=R(10*s,990*s)}while(r%10==0);ex.t=r/(10*s);ex.ans=Math.floor((r+5)/10)/s;ex.dg=r%10;mark=ex.t;
h=`<p class='tt'>Avrunda till närmaste ${SN[d]}</p><p>Ringen visar ett tal. Zooma in, se vilket streck den ligger närmast och skriv det talet.</p>`+inp}
else if(k=='between'){const a=R(s,99*s);ex.a=a/s;ex.b=(a+1)/s;ex.need=Math.min(2.2e5,400*s);
h=`<p class='tt'>Hitta ett tal mellan ${fm(ex.a,d)} och ${fm(ex.b,d)}</p><p>Zooma in och flytta så att mittlinjen står mellan de två talen. Zooma så långt du kan!</p>`}
else if(k=='mid'){const j=R(1,6),a=R(s,90*s);ex.a=a/s;ex.ans=(a+j)/s;
h=`<p class='tt'>Vad ligger mitt emellan ${fm(ex.a,d)} och ${fm((a+2*j)/s,d)}?</p><p>Använd linjen för att räkna steg mellan talen.</p>`+inp}
else{const a=R(s,99*s);let b;do{b=a*10+R(-9,10)}while(b%10==0);ex.X=a/s;ex.Y=b/(10*s);ex.big=Math.max(ex.X,ex.Y);ex.opts=[ex.X,ex.Y];if(Math.random()<.5)ex.opts.reverse();
h=`<p class='tt'>Vilket tal är störst?</p><p>Du kan zooma på linjen och kolla.</p><div class='r'>${ex.opts.map((v,i)=>`<button class='o' data-i='${i}'>${fm(v,v==ex.X?d:d+1)}</button>`).join('')}</div>`}
anim=null;view.c=50;view.p=minP();clampV();applyVis();
$('#pg').innerHTML=`<p class='st'>${KN[k]} · ${NM[d]}</p>${h}<p class='fb' id='fb'></p><div class='r'><button id='hb'>Ledtråd</button><button id='nx'>Nytt tal</button><button id='qx'>Avsluta</button></div>`;
$('#nx').onclick=newEx;$('#qx').onclick=()=>lpTab('ex');$('#hb').onclick=hint2;
const ab=$('#ab');if(ab){ab.onclick=check2;$('#ans').onkeydown=e=>{if(e.key=='Enter')check2()}}
document.querySelectorAll('#pg .o').forEach(b=>b.onclick=()=>{if(ex.done)return;if(ex.opts[+b.dataset.i]==ex.big){ex.done=true;applyVis();fb(`Rätt! ${fm(ex.X,d+1)} och ${fm(ex.Y,d+1)}: störst är ${fm(ex.big,d+1)}. Fler siffror betyder inte att talet är större.`,1);$('#nx').classList.add('pri')}else fb('Inte riktigt. Skriv båda talen med lika många decimaler och jämför.')});
draw()}
function check2(){if(ex.done)return;const v=parseFloat($('#ans').value.replace(',','.'));if(!isFinite(v))return fb('Skriv ett tal, till exempel 12,5.');
if(Math.abs(v-ex.ans)<1e-9)win2();else fb(ex.kind=='round'?'Inte riktigt. Titta på vilket streck ringen ligger närmast.':'Inte riktigt. Räkna stegen mellan talen och ta halva vägen.')}
function win2(){ex.done=true;applyVis();const k=ex.kind,d=ex.l;let m='';
if(k=='round')m=`Rätt, ${fm(ex.ans,d)}! Siffran efter är ${ex.dg}, så vi avrundar ${ex.dg>=5?'uppåt':'nedåt'}.`;
else if(k=='mid')m=`Rätt, ${fm(ex.ans,d)}! Det är halva avståndet mellan talen.`;
else m=`Bra! Mellan ${fm(ex.a,d)} och ${fm(ex.b,d)} finns fler tal, till exempel ${nf(view.c,view.p)}. Det finns oändligt många.`;
fb(m,1);const n=$('#nx');if(n)n.classList.add('pri')}
function hint2(){if(ex.done)return;const k=ex.kind;fb(k=='round'?'Zooma in tills du ser tydliga streck. Vilket streck ligger ringen närmast?':k=='between'?'Zooma in ännu mer. Mellan två streck finns fler tal!':k=='mid'?'Hur många steg är det mellan talen? Mitt emellan är halva vägen.':'Leta upp båda talen på linjen. Vilket ligger längst åt höger?')}
document.querySelectorAll('#lt .tab').forEach(b=>b.onclick=()=>lpTab(b.dataset.t));
$('#lx').onclick=closeLp;$('#ls').onclick=()=>$('#lp').hidden?openLp():closeLp();
$('#undo').onclick=()=>{strokes.pop();draw()};$('#clr').onclick=()=>{strokes.length=0;draw()};
